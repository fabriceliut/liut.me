<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 746" role="img" aria-labelledby="title desc">
  <title id="title">L'art de poser les questions qui transforment votre business</title>
  <desc id="desc">Couverture aquarelle en tons bleu, crème et ocre, avec des chemins qui se croisent autour de points de décision.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="12" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 .055"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="mono" mode="multiply"/>
    </filter>
    <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="7" result="turbulence"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="14"/>
      <feGaussianBlur stdDeviation=".35"/>
    </filter>
    <linearGradient id="paperTone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f3e8"/>
      <stop offset=".62" stop-color="#f2efe3"/>
      <stop offset="1" stop-color="#e8e4d6"/>
    </linearGradient>
    <linearGradient id="blueWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6d2d4" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#4e8190" stop-opacity=".82"/>
      <stop offset="1" stop-color="#183f54" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="ochreWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3c98d" stop-opacity=".9"/>
      <stop offset="1" stop-color="#a97043" stop-opacity=".66"/>
    </linearGradient>
    <clipPath id="artCrop"><rect y="300" width="500" height="446" rx="2"/></clipPath>
  </defs>

  <rect width="500" height="746" fill="url(#paperTone)"/>
  <g fill="#173f4a" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="250" y="78" font-size="28">L’art de poser</text>
    <text x="250" y="112" font-size="28">les questions</text>
    <text x="250" y="146" font-size="28">qui transforment</text>
    <text x="250" y="180" font-size="28">votre business</text>
  </g>
  <text x="250" y="218" fill="#6e766f" text-anchor="middle" font-size="13" font-family="Georgia, 'Times New Roman', serif">Fabrice Liut</text>
  <path d="M92 246 C156 232 204 257 263 246 S374 233 411 252" fill="none" stroke="#bd9a58" stroke-width="2" opacity=".5"/>
  <g clip-path="url(#artCrop)" filter="url(#wash)">
    <path d="M-40 470 C52 397 98 421 158 452 C224 486 260 398 330 416 C405 434 452 383 548 432 L548 790 L-40 790Z" fill="url(#blueWash)" opacity=".82"/>
    <path d="M-20 540 C56 486 122 508 184 553 C246 598 293 500 351 529 C418 563 468 503 535 535 L535 790 L-20 790Z" fill="#2e6173" opacity=".42"/>
    <path d="M-35 640 C35 598 100 628 162 664 C223 700 290 612 355 647 C420 682 469 620 540 653 L540 790 L-35 790Z" fill="#173e57" opacity=".5"/>
    <path d="M20 455 C86 426 114 477 163 477 C221 477 228 438 280 450 C343 466 378 427 430 451 C459 464 481 476 525 467" fill="none" stroke="#e9d39b" stroke-width="28" stroke-linecap="round" opacity=".64"/>
    <path d="M-10 590 C67 558 106 609 176 607 C246 605 286 552 351 581 C421 612 464 566 528 585" fill="none" stroke="#9fc5c7" stroke-width="23" stroke-linecap="round" opacity=".55"/>
    <path d="M75 680 C102 622 146 600 190 625 C225 644 240 697 277 701 C326 708 338 649 382 634 C423 620 454 644 490 681" fill="none" stroke="#d2af6d" stroke-width="16" stroke-linecap="round" opacity=".65"/>
    <path d="M38 430 C111 500 103 575 148 620 M207 410 C248 483 225 562 263 650 M380 407 C345 480 389 548 366 623" fill="none" stroke="#d8e1d8" stroke-width="5" stroke-linecap="round" opacity=".65"/>
  </g>
  <g fill="none" stroke="#f3ead5" stroke-width="4" stroke-linecap="round" opacity=".88">
    <path d="M80 522 C108 493 143 500 158 526 C174 554 151 577 129 595 C116 606 111 617 111 634"/>
    <path d="M111 652 v2"/>
    <path d="M319 487 C338 470 366 476 375 497 C383 518 366 533 348 546 C337 555 334 564 334 577"/>
    <path d="M334 594 v2"/>
  </g>
  <g fill="#f7f1df" opacity=".82">
    <circle cx="73" cy="519" r="7"/><circle cx="198" cy="593" r="6"/><circle cx="310" cy="520" r="8"/><circle cx="424" cy="589" r="6"/>
  </g>
  <g fill="#173f4a" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="2" opacity=".72">
    <text x="28" y="710">UNE QUESTION OUVRE UN CHEMIN</text>
    <text x="28" y="728">ÉCOUTER · REFORMULER · CHOISIR</text>
  </g>
</svg>
